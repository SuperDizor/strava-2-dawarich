services:
  strava-2-dawarich:
    build: .
    image: strava-2-dawarich:local
    container_name: strava-2-dawarich
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      STATE_DIR: /data/state
      GPX_DIR: /data/gpx
      LOG_DIR: /data/logs
      STRAVA_CALLBACK_BIND: 0.0.0.0
      CUSTOM_CA_CERT: /certs/rootCA.pem
      REQUESTS_CA_BUNDLE: /tmp/combined-ca.pem
    volumes:
      - ${APPDATA_PATH:-./data}/state:/data/state
      - ${APPDATA_PATH:-./data}/gpx:/data/gpx
      - ${APPDATA_PATH:-./data}/logs:/data/logs
      - ${CUSTOM_CA_PATH:-./certs/rootCA.pem}:/certs/rootCA.pem:ro
    ports:
      - "${STRAVA_CALLBACK_PORT:-8089}:8089"
